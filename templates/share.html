<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Preview picture</title>
<link rel="stylesheet" href="../assets/theme.css">
<style>
/* The preview picture for shared links: exactly 1200 x 630 pixels. The build makes a PNG from this page. */
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:var(--paper);display:grid;grid-template-columns:1fr 470px;gap:48px;padding:60px 64px;align-items:center}
body.plain{grid-template-columns:1fr}
.txt{display:flex;flex-direction:column;justify-content:space-between;height:100%;min-width:0}
.brand{font:400 46px/1 var(--font-display);color:var(--ink)}
.brand span{font:500 21px/1 var(--font-body);color:var(--muted);margin-left:4px;letter-spacing:.04em}
h1{margin:0;font:400 84px/1.03 var(--font-display);letter-spacing:-.01em;color:var(--ink);text-wrap:balance}
h1.t2{font-size:70px} h1.t3{font-size:56px}
body.plain h1{font-size:118px}
.tags{display:flex;gap:10px}
.tags span{font:500 19px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--c1);background:var(--tint);border-radius:6px;padding:10px 12px}
.pic{background:var(--surface);border:1px solid var(--rule);border-radius:18px;overflow:hidden;aspect-ratio:16/9;align-self:center}
.pic svg{width:100%;height:100%;display:block}
.pic:empty{display:none}
</style>
</head>
<body class="{{plain}}">
  <div class="txt">
    <div class="brand">learn<span>.ankerl.com</span></div>
    <h1 class="{{size}}">{{title}}</h1>
    <div class="tags">{{tags}}</div>
  </div>
  <div class="pic">{{cover}}</div>
</body>
</html>
