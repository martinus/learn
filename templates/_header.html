<div class="site-bar{{wide}}">
  <div class="in">
    <a class="brand" href="{{root}}" aria-label="learn.ankerl.com, all explainers">learn<span>.ankerl.com</span></a>
    <div class="toggles">
      <div class="seg" role="group" aria-label="Language / Sprache" data-lang-switch hidden>{{lang_buttons}}</div>
      <div class="seg" role="group" aria-label="Colour mode">
        <button type="button" data-set-theme="light" aria-pressed="false" aria-label="Bright mode" title="Bright"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <button type="button" data-set-theme="dark" aria-pressed="false" aria-label="Dark mode" title="Dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.500 10.5z"/></svg></button>
      </div>
    </div>
  </div>
  {{progress}}
</div>
